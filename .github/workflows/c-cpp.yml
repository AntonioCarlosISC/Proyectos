name: C/C++ Multiplatform Build

on:
  push:
    branches: [ "MAIN" ]
  pull_request:
    branches: [ "MAIN" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Compile RPG Engine
        working-directory: RPGMotor/app
        run: gcc -std=c99 -Wall -O2 main.c game_loop.c -o rpg -lSDL2

      - name: Run RPG Engine --version
        working-directory: RPGMotor/app
        run: ./rpg --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-linux
          path: RPGMotor/app/rpg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Instalar MSYS2 usando la action oficial
      - uses: msys2/setup-msys2@v3
        with:
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2

      - name: Compile RPG Engine
        shell: msys2 {0}
        working-directory: RPGMotor/app
        run: gcc -std=c99 -Wall -O2 main.c game_loop.c -o rpg.exe -lmingw32 -lSDL2main -lSDL2

      - name: Run RPG Engine --version
        shell: msys2 {0}
        working-directory: RPGMotor/app
        run: ./rpg.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-windows
          path: RPGMotor/app/rpg.exe
