name: C/C++ Multiplatform Build

on:
  push:
    branches: [ "MAIN" ]
  pull_request:
    branches: [ "MAIN" ]

jobs:
  # 🐧 Linux build
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Compile RPG Engine
        working-directory: RPGMotor/app
        run: gcc -std=c99 -Wall -O2 main.c game_loop.c -o rpg -lSDL2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-linux
          path: RPGMotor/app/rpg


  # 🪟 Windows build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Instalar MSYS2 y dependencias SDL2
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2

      - name: Compile RPG Engine
        shell: msys2 {0}
        working-directory: RPGMotor/app
        run: gcc -std=c99 -Wall -O2 main.c game_loop.c -o rpg.exe -lmingw32 -lSDL2main -lSDL2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-windows
          path: RPGMotor/app/rpg.exe


  # 🍏 macOS build
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 via Homebrew
        run: brew install sdl2

      - name: Fix SDL2 include path for macOS
        run: |
          SDL2_PATH=$(brew --prefix sdl2)
          sudo mkdir -p /usr/local/include/SDL2
          sudo ln -sf "$SDL2_PATH/SDL2.framework/Headers/"/* /usr/local/include/SDL2/

      - name: Compile RPG Engine (using SDL2.framework)
        working-directory: RPGMotor/app
        run: |
          gcc -std=c99 -Wall -O2 main.c game_loop.c -o rpg \
              -F$(brew --prefix sdl2)/Frameworks -framework SDL2

      - name: Verify binary
        working-directory: RPGMotor/app
        run: file rpg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-macos
          path: RPGMotor/app/rpg
