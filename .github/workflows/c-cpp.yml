name: C/C++ Multiplatform Build

on:
  push:
    branches: [ "MAIN" ]
  pull_request:
    branches: [ "MAIN" ]

jobs:
  # 🐧 Linux build
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Compile RPG Engine
        working-directory: RPGMotor/
        run: |
          gcc -std=c99 -Wall -O2 \
          ./app/main.c ./app/game_loop.c \
          ./engine/core.c \
          ./engine/input/input.c \
          ./engine/graphics/graphics.c \
          ./engine/graphics/draw.c \
          -I./engine -I./engine/input -I./engine/graphics \
          -lmingw32 -lSDL2main -lSDL2 \
          -o ./app/rpg


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-linux
          path: RPGMotor/app/rpg

  # 🪟 Windows build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2

      - name: Compile RPG Engine
        shell: msys2 {0}
        working-directory: RPGMotor/
        run: |
          gcc -std=c99 -Wall -O2 \
          ./app/main.c ./app/game_loop.c \
          ./engine/core.c \
          ./engine/input/input.c \
          ./engine/graphics/graphics.c \
          ./engine/graphics/draw.c \
          -I./engine -I./engine/input -I./engine/graphics \
          -lmingw32 -lSDL2main -lSDL2 \
          -o ./app/rpg.exe



      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-windows
          path: RPGMotor/app/rpg.exe
